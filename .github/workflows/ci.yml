name: Continuous Integration

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "website/**"
      - "**.md"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "website/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. RHP Engine & Playground Test Suite (Linux, macOS)
  # =========================================================================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Run RHP Language Engine Tests
        run: cargo test --verbose

      - name: Run RHP Playground Tests
        run: |
          cd playground
          cargo test --verbose

  # =========================================================================
  # 2. Website Static Build Verification
  # =========================================================================
  test-website:
    name: Verify Documentation Website Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix website --legacy-peer-deps

      - name: Build Astro Website
        run: npm run build --prefix website
        env:
          ASTRO_TELEMETRY_DISABLED: 1
