name: Release (Cargo & CLI Binaries)

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Version Tag (e.g. v0.1.0; defaults to release tag or Cargo.toml version)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create Draft Release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Create Pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. Pre-Release Test Verification
  # =========================================================================
  check-and-test:
    name: Verify Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Run RHP Engine Tests
        run: cargo test

      - name: Run RHP Playground Tests
        run: |
          cd playground
          cargo test

  # =========================================================================
  # 2. Cross-Platform CLI Binary Matrix Build & Packaging
  # =========================================================================
  build-binaries:
    name: Build (${{ matrix.target }})
    needs: check-and-test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_ext: ""
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_ext: ".exe"
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_ext: ""
          # macOS Intel (x86_64) - cross-compiled via Apple Silicon runner
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            VER="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VER="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${{ github.ref_name }}"
          else
            PKG_VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            VER="v${PKG_VER}"
          fi
          echo "VER=${VER}" >> $GITHUB_OUTPUT
          echo "Building release for version: ${VER}"

      - name: Build RHP Engine Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build RHP Playground Release Binary
        shell: bash
        run: |
          cd playground
          npm ci
          npm run build
          cargo build --release --target ${{ matrix.target }}

      # -----------------------------------------------------------------------
      # Package Unix Distributions (Linux & macOS)
      # -----------------------------------------------------------------------
      - name: Package Unix Binaries (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VER="${{ steps.version.outputs.VER }}"
          TARGET="${{ matrix.target }}"
          DIST_DIR="dist_${TARGET}"
          mkdir -p "${DIST_DIR}"

          # Locate built binaries
          RHP_BIN="target/${TARGET}/release/rhp"
          RHP_PLAY_BIN="playground/target/${TARGET}/release/rhp-play"

          if [ ! -f "$RHP_BIN" ]; then RHP_BIN="target/release/rhp"; fi
          if [ ! -f "$RHP_PLAY_BIN" ]; then RHP_PLAY_BIN="playground/target/release/rhp-play"; fi

          # 1. Standalone RHP compiler archive
          mkdir -p "pkg_rhp"
          cp "$RHP_BIN" "pkg_rhp/rhp"
          cp README.md "pkg_rhp/"
          tar -czvf "${DIST_DIR}/rhp-${VER}-${TARGET}.tar.gz" -C "pkg_rhp" .

          # 2. Standalone RHP Playground archive
          mkdir -p "pkg_rhp_play"
          cp "$RHP_PLAY_BIN" "pkg_rhp_play/rhp-play"
          cp playground/README.md "pkg_rhp_play/"
          tar -czvf "${DIST_DIR}/rhp-play-${VER}-${TARGET}.tar.gz" -C "pkg_rhp_play" .

          # 3. Complete bundle (Compiler + Playground together)
          mkdir -p "pkg_bundle"
          cp "$RHP_BIN" "pkg_bundle/rhp"
          cp "$RHP_PLAY_BIN" "pkg_bundle/rhp-play"
          cp README.md "pkg_bundle/"
          tar -czvf "${DIST_DIR}/rhp-bundle-${VER}-${TARGET}.tar.gz" -C "pkg_bundle" .

          # 4. Homebrew-compatible standalone archives (e.g. rhp-v0.1.0-TARGET.tar.gz)
          PKG_VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${VER}" != "v${PKG_VER}" ]; then
            cp "${DIST_DIR}/rhp-${VER}-${TARGET}.tar.gz" "${DIST_DIR}/rhp-v${PKG_VER}-${TARGET}.tar.gz"
          fi

          # Compute SHA-256 Checksums
          cd "${DIST_DIR}"
          for file in *.tar.gz; do
            shasum -a 256 "$file" > "${file}.sha256"
          done

      # -----------------------------------------------------------------------
      # Package Windows Distributions (zip)
      # -----------------------------------------------------------------------
      - name: Package Windows Binaries (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VER }}"
          $target = "${{ matrix.target }}"
          $distDir = "dist_${target}"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          # Locate binaries
          $rhpBin = "target/${target}/release/rhp.exe"
          if (-not (Test-Path $rhpBin)) { $rhpBin = "target/release/rhp.exe" }

          $rhpPlayBin = "playground/target/${target}/release/rhp-play.exe"
          if (-not (Test-Path $rhpPlayBin)) { $rhpPlayBin = "playground/target/release/rhp-play.exe" }

          # 1. Standalone RHP compiler
          $pkgRhp = "pkg_rhp"
          New-Item -ItemType Directory -Force -Path $pkgRhp | Out-Null
          Copy-Item $rhpBin -Destination "$pkgRhp/rhp.exe"
          Copy-Item "README.md" -Destination "$pkgRhp/"
          Compress-Archive -Path "$pkgRhp/*" -DestinationPath "$distDir/rhp-$ver-$target.zip" -Force

          # 2. Standalone RHP Playground
          $pkgPlay = "pkg_rhp_play"
          New-Item -ItemType Directory -Force -Path $pkgPlay | Out-Null
          Copy-Item $rhpPlayBin -Destination "$pkgPlay/rhp-play.exe"
          Copy-Item "playground/README.md" -Destination "$pkgPlay/"
          Compress-Archive -Path "$pkgPlay/*" -DestinationPath "$distDir/rhp-play-$ver-$target.zip" -Force

          # 3. Complete bundle
          $pkgBundle = "pkg_bundle"
          New-Item -ItemType Directory -Force -Path $pkgBundle | Out-Null
          Copy-Item $rhpBin -Destination "$pkgBundle/rhp.exe"
          Copy-Item $rhpPlayBin -Destination "$pkgBundle/rhp-play.exe"
          Copy-Item "README.md" -Destination "$pkgBundle/"
          Compress-Archive -Path "$pkgBundle/*" -DestinationPath "$distDir/rhp-bundle-$ver-$target.zip" -Force

          # 4. Standard versioned package for package managers
          $pkgVer = (Select-String -Path "Cargo.toml" -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($ver -ne "v$pkgVer") {
            Copy-Item "$distDir/rhp-$ver-$target.zip" -Destination "$distDir/rhp-v$pkgVer-$target.zip" -Force
          }

          # Compute SHA-256 Checksums
          Set-Location $distDir
          Get-ChildItem -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.Name).sha256" -Encoding ASCII
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.target }}
          path: dist_${{ matrix.target }}/*

  # =========================================================================
  # 3. Publish GitHub Release
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            VER="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VER="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${{ github.ref_name }}"
          else
            PKG_VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            VER="v${PKG_VER}"
          fi
          echo "VER=${VER}" >> $GITHUB_OUTPUT
          echo "Release version: ${VER}"

      - name: Download all build distribution artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Consolidate distribution files
        shell: bash
        run: |
          mkdir -p release_files
          find release_artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Generate Release Assets Description
        id: release_desc
        shell: bash
        run: |
          VER="${{ steps.version.outputs.VER }}"
          cat << 'EOF' | sed 's/^          //' > release_body.md
          ### 📦 Release Packages & Checksums

          | Package Archive | Target Platform | SHA-256 Checksum |
          | :--- | :--- | :--- |
          EOF

          for hash_file in release_files/*.sha256; do
            if [ -f "$hash_file" ]; then
              filename=$(basename "${hash_file%.sha256}")
              checksum=$(awk '{print $1}' "$hash_file")
              platform="Generic"
              if [[ "$filename" == *"unknown-linux-gnu"* ]]; then
                platform="Linux (x86_64)"
              elif [[ "$filename" == *"aarch64-apple-darwin"* ]]; then
                platform="macOS Apple Silicon (ARM64)"
              elif [[ "$filename" == *"x86_64-apple-darwin"* ]]; then
                platform="macOS Intel (x86_64)"
              elif [[ "$filename" == *"windows-msvc"* ]]; then
                platform="Windows (x86_64)"
              fi
              echo "| \`$filename\` | $platform | \`$checksum\` |" >> release_body.md
            fi
          done

          cat << 'EOF' | sed 's/^          //' >> release_body.md

          ### 🚀 Quick Start & Installation

          #### 🍺 Homebrew (Recommended for macOS & Linux)
          ```bash
          brew install vuenice/rhp/rhp
          ```

          #### 📦 Manual Download & Unpack (Linux / macOS)
          ```bash
          # Unpack RHP release bundle:
          tar -xzf rhp-bundle-*.tar.gz

          # Move binaries to your PATH:
          sudo mv rhp /usr/local/bin/
          sudo mv rhp-play /usr/local/bin/

          # Verify installation:
          rhp --version
          ```

          #### 🦀 Crates.io
          ```bash
          cargo install rhp
          ```

          For language specifications, documentation, and tutorials, visit [rhp.dev](https://rhp.dev) or browse [documentation](https://rhp.dev/docs).
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VER }}
          files: release_files/*
          body_path: release_body.md
          append_body: true
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' || (github.event_name == 'release' && github.event.release.draft) }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || (github.event_name == 'release' && github.event.release.prerelease) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 4. Cargo / Crates.io Release
  # =========================================================================
  publish-cargo:
    name: Publish Crate to Crates.io
    needs: [check-and-test, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Informational Notice (No Crates.io Token Configured)
        if: env.CARGO_REGISTRY_TOKEN == ''
        shell: bash
        run: |
          echo "::notice ::CARGO_REGISTRY_TOKEN secret is not configured in this repository. Skipping cargo publish to crates.io. To enable automated crates.io publishing, add CARGO_REGISTRY_TOKEN in GitHub Settings -> Secrets and variables -> Actions."
          cargo package --list
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
