name: CI/CD & Cross-Platform Distribution

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish GitHub Release (true/false)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. Test Suite (Linux, macOS, Windows)
  # =========================================================================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Run RHP Language Engine Tests
        run: cargo test

      - name: Run RHP Playground Tests
        run: |
          cd playground
          cargo test

  # =========================================================================
  # 2. Cross-Platform Release Distribution Matrix
  # =========================================================================
  build-dist:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_ext: ""
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_ext: ".exe"
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_ext: ""
          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Determine Version Tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VER=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "VER=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build RHP Engine Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build RHP Playground Release Binary
        shell: bash
        run: |
          cd playground
          cargo build --release --target ${{ matrix.target }}

      # -----------------------------------------------------------------------
      # Package Unix Distributions (Linux & macOS)
      # -----------------------------------------------------------------------
      - name: Package Unix Binaries (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VER="${{ steps.version.outputs.VER }}"
          TARGET="${{ matrix.target }}"
          DIST_DIR="dist_${TARGET}"
          mkdir -p "${DIST_DIR}"

          # Locate built binaries
          RHP_BIN="target/${TARGET}/release/rhp"
          RHP_PLAY_BIN="playground/target/${TARGET}/release/rhp-play"

          # Fallback to default target release if not in target subdir
          if [ ! -f "$RHP_BIN" ]; then RHP_BIN="target/release/rhp"; fi
          if [ ! -f "$RHP_PLAY_BIN" ]; then RHP_PLAY_BIN="playground/target/release/rhp-play"; fi

          # 1. Standalone RHP compiler archive
          mkdir -p "pkg_rhp"
          cp "$RHP_BIN" "pkg_rhp/rhp"
          cp README.md "pkg_rhp/"
          tar -czvf "${DIST_DIR}/rhp-${VER}-${TARGET}.tar.gz" -C "pkg_rhp" .

          # 2. Standalone RHP Playground archive
          mkdir -p "pkg_rhp_play"
          cp "$RHP_PLAY_BIN" "pkg_rhp_play/rhp-play"
          cp playground/README.md "pkg_rhp_play/"
          tar -czvf "${DIST_DIR}/rhp-play-${VER}-${TARGET}.tar.gz" -C "pkg_rhp_play" .

          # 3. Complete bundle (Compiler + Playground together)
          mkdir -p "pkg_bundle"
          cp "$RHP_BIN" "pkg_bundle/rhp"
          cp "$RHP_PLAY_BIN" "pkg_bundle/rhp-play"
          cp README.md "pkg_bundle/"
          tar -czvf "${DIST_DIR}/rhp-bundle-${VER}-${TARGET}.tar.gz" -C "pkg_bundle" .

          # Compute SHA-256 Checksums
          cd "${DIST_DIR}"
          for file in *.tar.gz; do
            shasum -a 256 "$file" > "${file}.sha256"
          done

      # -----------------------------------------------------------------------
      # Package Windows Distributions (zip)
      # -----------------------------------------------------------------------
      - name: Package Windows Binaries (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VER }}"
          $target = "${{ matrix.target }}"
          $distDir = "dist_${target}"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          # Locate binaries
          $rhpBin = "target/${target}/release/rhp.exe"
          if (-not (Test-Path $rhpBin)) { $rhpBin = "target/release/rhp.exe" }

          $rhpPlayBin = "playground/target/${target}/release/rhp-play.exe"
          if (-not (Test-Path $rhpPlayBin)) { $rhpPlayBin = "playground/target/release/rhp-play.exe" }

          # 1. Standalone RHP compiler
          $pkgRhp = "pkg_rhp"
          New-Item -ItemType Directory -Force -Path $pkgRhp | Out-Null
          Copy-Item $rhpBin -Destination "$pkgRhp/rhp.exe"
          Copy-Item "README.md" -Destination "$pkgRhp/"
          Compress-Archive -Path "$pkgRhp/*" -DestinationPath "$distDir/rhp-$ver-$target.zip" -Force

          # 2. Standalone RHP Playground
          $pkgPlay = "pkg_rhp_play"
          New-Item -ItemType Directory -Force -Path $pkgPlay | Out-Null
          Copy-Item $rhpPlayBin -Destination "$pkgPlay/rhp-play.exe"
          Copy-Item "playground/README.md" -Destination "$pkgPlay/"
          Compress-Archive -Path "$pkgPlay/*" -DestinationPath "$distDir/rhp-play-$ver-$target.zip" -Force

          # 3. Complete bundle
          $pkgBundle = "pkg_bundle"
          New-Item -ItemType Directory -Force -Path $pkgBundle | Out-Null
          Copy-Item $rhpBin -Destination "$pkgBundle/rhp.exe"
          Copy-Item $rhpPlayBin -Destination "$pkgBundle/rhp-play.exe"
          Copy-Item "README.md" -Destination "$pkgBundle/"
          Compress-Archive -Path "$pkgBundle/*" -DestinationPath "$distDir/rhp-bundle-$ver-$target.zip" -Force

          # Compute SHA-256 Checksums
          Set-Location $distDir
          Get-ChildItem -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.Name).sha256" -Encoding ASCII
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.target }}
          path: dist_${{ matrix.target }}/*

  # =========================================================================
  # 3. GitHub Release Creation (on Tag or Manual Dispatch)
  # =========================================================================
  release:
    name: Publish GitHub Release
    needs: [test, build-dist]
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build distribution artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Consolidate distribution files
        shell: bash
        run: |
          mkdir -p release_files
          find release_artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
