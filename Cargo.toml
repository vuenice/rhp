[package]
name = "rhp"
version = "0.1.0"
edition = "2024"
default-run = "rhp"
description = "Rust-Powered High-Performance PHP-Family Language, JIT Compiler, and Runtime"
license = "MIT"
authors = ["RHP Core Contributors"]
repository = "https://github.com/vuenice/rhp"
homepage = "https://rhp.dev"
documentation = "https://rhp.dev/docs"
readme = "README.md"
keywords = ["compiler", "jit", "language", "php", "rust"]
categories = ["compilers", "development-tools"]


[dependencies]
cranelift-codegen = "0.136.2"
cranelift-frontend = "0.136.2"
cranelift-jit = "0.136.2"
cranelift-module = "0.136.2"
cranelift-native = "0.136.2"
logos = "0.16.1"
thiserror = "2.0.21"
indexmap = "2"
tokio = { version = "1.54.0", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "time", "net", "sync", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

