[package]
name = "rhp-play"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rhp-play"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "time", "macros"] }
rfd = "0.15"
rhp = { path = "../.." }

[build-dependencies]
tauri-build = { version = "2", features = [] }
