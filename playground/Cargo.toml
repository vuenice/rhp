[package]
name = "rhp-play"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rhp-play"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default", "glow"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["syntect"] }
syntect = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "time", "macros"] }
rhp = { path = ".." }
